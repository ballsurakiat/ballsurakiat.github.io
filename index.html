<head>

    <style>
        :root {
            --ink: #1a1a1a;
            --ink-soft: #4a4a4a;
            --ink-light: #6b6b6b;
            --rule: #d4d4d4;
            --rule-strong: #1a1a1a;
        }

        * { box-sizing: border-box; }

        html { background: #e9e9e9; }

        body {
            font-family: 'Inter', 'Noto Sans Thai', Arial, sans-serif;
            font-size: 10.5pt;
            line-height: 1.55;
            color: var(--ink);
            margin: 0;
            padding: 24px 12px 48px;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- A4 sheet ---------- */
        .sheet {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 16mm 18mm;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        /* ---------- Toolbar ---------- */
        .toolbar {
            width: 210mm;
            margin: 0 auto 12px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }

        .toolbar button,
        .toolbar a {
            font: inherit;
            font-size: 9.5pt;
            color: var(--ink-soft);
            background: #fff;
            border: 1px solid var(--rule);
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .toolbar button:hover,
        .toolbar a:hover { border-color: #999; color: var(--ink); }

        /* ---------- Header ---------- */
        .cv-header {
            border-bottom: 2px solid var(--rule-strong);
            padding-bottom: 10px;
            margin-bottom: 18px;
        }

        .cv-name {
            font-size: 22pt;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 2px;
        }

        .cv-role {
            font-size: 12pt;
            font-weight: 500;
            color: var(--ink-soft);
            margin: 0 0 6px;
        }

        .cv-contact {
            font-size: 9.5pt;
            color: var(--ink-soft);
        }

        .cv-contact span + span::before {
            content: "|";
            color: var(--rule);
            margin: 0 8px;
        }

        .cv-contact a { color: var(--ink-soft); text-decoration: none; }
        .cv-contact a:hover { text-decoration: underline; }

        /* ---------- Sections ---------- */
        .section { margin-bottom: 16px; }

        .section-title {
            font-size: 10.5pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid var(--rule-strong);
            padding-bottom: 3px;
            margin: 0 0 10px;
        }

        p { margin: 0 0 6px; }

        .muted { color: var(--ink-light); }

        /* ---------- About ---------- */
        .stats {
            font-size: 9.5pt;
            color: var(--ink-soft);
        }

        .stats span + span::before {
            content: "•";
            color: var(--rule);
            margin: 0 8px;
        }

        /* ---------- Skills ---------- */
        .skills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 28px;
        }

        .skill-row { display: flex; gap: 8px; }

        .skill-label {
            font-weight: 600;
            min-width: 32mm;
            flex: none;
        }

        .skill-items { color: var(--ink-soft); }

        /* ---------- Experience ---------- */
        .entry {
            margin-bottom: 12px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .entry:last-child { margin-bottom: 0; }

        /* an entry with sub-entries is too tall to keep on one page */
        .entry.has-sub {
            break-inside: auto;
            page-break-inside: auto;
        }

        .entry-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .entry-title { font-weight: 700; }

        .entry-period {
            font-size: 9.5pt;
            color: var(--ink-light);
            white-space: nowrap;
            flex: none;
        }

        .entry-org {
            font-size: 10pt;
            color: var(--ink-soft);
            margin-bottom: 3px;
        }

        .entry-desc { margin: 0 0 3px; }

        .entry-tech {
            font-size: 9.5pt;
            color: var(--ink-light);
        }

        .sub-list {
            margin: 8px 0 0 0;
            padding-left: 12px;
            border-left: 2px solid var(--rule);
        }

        .sub-entry {
            margin-bottom: 9px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .sub-entry:last-child { margin-bottom: 0; }

        .sub-title { font-weight: 600; }

        .sub-label {
            font-size: 9.5pt;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        a.credential { color: var(--ink-soft); }

        /* ---------- Print ---------- */
        @page {
            size: A4;
            margin: 14mm 16mm;
        }

        @media print {
            html { background: #fff; }

            body {
                padding: 0;
                font-size: 10pt;
                color: #000;
            }

            .sheet {
                width: auto;
                min-height: 0;
                margin: 0;
                padding: 0;
                box-shadow: none;
            }

            .no-print { display: none !important; }

            .section-title,
            .entry-head { page-break-after: avoid; break-after: avoid; }

            a { color: #000; text-decoration: none; }
        }

        /* ---------- Small screens ---------- */
        @media screen and (max-width: 230mm) {
            body { padding: 12px 8px 32px; }
            .sheet, .toolbar { width: 100%; }
            .sheet { min-height: 0; padding: 20px 18px; }
            .skills { grid-template-columns: 1fr; }
            .skill-label { min-width: 28mm; }
        }
    </style>
</head>

                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char];
            });

                        <p class="entry-desc">${escapeHtml(site.description)}</p>
                        <div class="entry-tech">${techLine(site.technologies)}</div>
                    </div>`;
            }).join('');

                ? `<div class="sub-list">
                        <div class="sub-label">${escapeHtml(lang.experience.projectDetails)}</div>
                        ${sites}
                   </div>`
                : '';

                <div class="entry${sites ? ' has-sub' : ''}">
                    <div class="entry-head">
                        <div class="entry-title">${escapeHtml(job.title)}</div>
                        <div class="entry-period">${escapeHtml(job.period)}</div>

                    <p class="entry-desc">${escapeHtml(job.description)}</p>

                </section>

                <section class="section">
                    <h2 class="section-title">${escapeHtml(lang.education.title)}</h2>
                    <div class="entry">
                        <div class="entry-title">${escapeHtml(profile.education.degree)}</div>
                        <div class="entry-org">${escapeHtml(profile.education.school)}</div>
                        <div class="entry-tech">${escapeHtml(profile.education.detail)}</div>
                    </div>
                </section>

                <section class="section">
                    <h2 class="section-title">${escapeHtml(lang.certifications.title)}</h2>
                    <div class="entry">
                        <div class="entry-title">${escapeHtml(profile.certification.name)}</div>
                        <div class="entry-org">${escapeHtml(profile.certification.issuer)}</div>
                        <div class="entry-tech">
                            <a class="credential" href="${escapeHtml(profile.certification.url)}" target="_blank" rel="noopener">${escapeHtml(lang.certifications.viewCredential)}</a>
                        </div>
                    </div>
                </section>

                <section class="section">
                    <h2 class="section-title">${escapeHtml(lang.contact.title)}</h2>
                    <p>${escapeHtml(lang.contact.description)}</p>
                    <div class="cv-contact">
                        <span><a href="mailto:${escapeHtml(profile.email)}">${escapeHtml(profile.email)}</a></span>
                        <span><a href="${escapeHtml(profile.linkedin.url)}" target="_blank" rel="noopener">${escapeHtml(profile.linkedin.label)}</a></span>
                    </div>
                </section>`;

            document.documentElement.lang = currentLang;
            document.getElementById('lang-switcher').textContent = currentLang.toUpperCase();
        }

        function switchLanguage() {
            currentLang = currentLang === 'en' ? 'th' : 'en';
            localStorage.setItem('preferred-language', currentLang);
            renderCv();
        }

        document.addEventListener('DOMContentLoaded', function () {
            const savedLang = localStorage.getItem('preferred-language');
            if (savedLang === 'en' || savedLang === 'th') {
                currentLang = savedLang;
            }
            renderCv();

            document.getElementById('lang-switcher').addEventListener('click', switchLanguage);
            document.getElementById('print-btn').addEventListener('click', function () {
                window.print();
            });
        });
    </script>
</body>
</html>
